<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}LostFound{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<nav class="topbar">
  <div class="topbar-inner">
    <a href="{{ url_for('index') }}" class="brand">Lost<span>Found</span></a>
    <div class="nav-links">
      <a href="{{ url_for('items_page') }}?type=lost">Lost items</a>
      <a href="{{ url_for('items_page') }}?type=found">Found items</a>
      <a href="{{ url_for('report_lost_page') }}">Report lost</a>
      <a href="{{ url_for('report_found_page') }}">Report found</a>
      <span id="nav-auth-area"></span>
    </div>
  </div>
</nav>

<main>
  {% block content %}{% endblock %}
</main>

<footer class="site">
  <div class="container">&copy; 2026 LostFound &mdash; helping campuses reunite people with their things.</div>
</footer>

<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
