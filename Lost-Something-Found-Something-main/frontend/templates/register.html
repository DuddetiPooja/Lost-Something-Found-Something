{% extends "base.html" %}
{% block title %}Register — LostFound{% endblock %}
{% block content %}
<div class="container">
  <div class="form-card">
    <h1>Create an account</h1>
    <div id="form-msg" class="form-msg"></div>
    <form id="register-form">
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" minlength="6" required>
        <small style="color:var(--ink-soft);">At least 6 characters</small>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Create account</button>
    </form>
    <p style="margin-top:16px;font-size:0.88rem;">Already have an account? <a href="{{ url_for('login_page') }}">Log in</a></p>
  </div>
</div>
{% endblock %}
